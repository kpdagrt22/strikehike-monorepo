name: Events weekly build

on:
  schedule:
    # Monday 03:00 IST = Sunday 21:30 UTC.
    - cron: "30 21 * * 0"
  workflow_dispatch:
    inputs:
      today:
        description: "Override today (YYYY-MM-DD); leave blank for the UTC date"
        required: false
        type: string
      dry_run:
        description: "Build and gate only; never publish"
        required: false
        default: false
        type: boolean
      macro_unchanged_reason:
        description: "Explicit reason if the macro last date is allowed to stay unchanged"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: events-weekly
  cancel-in-progress: false

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  PYTHONPATH: "src:."

jobs:
  build:
    name: Build and gate the weekly events bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The publish job reads this; without it needs.build.outputs is empty and
    # publishing is always skipped.
    outputs:
      publishable: ${{ steps.build.outputs.publishable }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Run the events tests
        run: |
          python -m pytest tests/events -q

      - name: Verify FRED release ids and names
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "${FRED_API_KEY:-}" ]; then
            echo "::error::FRED_API_KEY is not set; cannot verify the configured FRED releases."
            exit 1
          fi
          python -m astro_finance.events.verify_fred_releases

      - name: Fetch the newest previous bundle release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_dir=""
          mkdir -p "$RUNNER_TEMP/previous"
          tag="$(gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("events-bundle-")) | .tagName' \
            2>/dev/null | head -n 1 || true)"
          if [ -n "$tag" ]; then
            if gh release download "$tag" \
              --pattern 'events-bundle-*.tar.gz' \
              --dir "$RUNNER_TEMP/previous" --clobber; then
              tarball="$(find "$RUNNER_TEMP/previous" -maxdepth 1 \
                -name 'events-bundle-*.tar.gz' | head -n 1)"
              if [ -n "$tarball" ]; then
                mkdir -p "$RUNNER_TEMP/previous/extracted"
                tar -xzf "$tarball" -C "$RUNNER_TEMP/previous/extracted"
                manifest="$(find "$RUNNER_TEMP/previous/extracted" \
                  -name manifest.json -print -quit)"
                if [ -n "$manifest" ]; then
                  previous_dir="$(dirname "$manifest")"
                fi
              fi
            else
              echo "::warning::Could not download $tag; building without a previous bundle."
            fi
          else
            echo "No events-bundle-* release yet; this is the first build."
          fi
          echo "previous_dir=$previous_dir" >> "$GITHUB_OUTPUT"

      - name: Refresh the macro regime artifact
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FRED_API_KEY:-}" ]; then
            echo "::error::FRED_API_KEY is not set; cannot refresh the macro dataset."
            exit 1
          fi
          python -m scripts.flows.macro_ingestion \
            --source api \
            --output-dir "$RUNNER_TEMP/macro-refresh"

      - name: Validate the refreshed macro artifact
        shell: bash
        continue-on-error: true
        env:
          PREVIOUS_DIR: ${{ steps.previous.outputs.previous_dir }}
          MACRO_UNCHANGED_REASON: ${{ github.event.inputs.macro_unchanged_reason }}
        run: |
          set -euo pipefail
          baseline="$PWD/data/processed/macro_regime_history.parquet"
          if [ -n "${PREVIOUS_DIR:-}" ] && \
            [ -f "$PREVIOUS_DIR/data/macro_regime_history.parquet" ]; then
            baseline="$PREVIOUS_DIR/data/macro_regime_history.parquet"
          fi
          reason_args=()
          if [ -n "${MACRO_UNCHANGED_REASON:-}" ]; then
            reason_args=(--allow-unchanged-reason "$MACRO_UNCHANGED_REASON")
          fi
          python -m astro_finance.events.macro_data validate \
            --data "$RUNNER_TEMP/macro-refresh/macro_regime_history.parquet" \
            --baseline "$baseline" \
            --json-out "$RUNNER_TEMP/macro-validation.json" \
            "${reason_args[@]}"

      - name: Train, evaluate and promote the forecast model
        shell: bash
        env:
          PREVIOUS_DIR: ${{ steps.previous.outputs.previous_dir }}
        run: |
          set -euo pipefail
          previous=()
          if [ -n "${PREVIOUS_DIR:-}" ]; then
            previous=(--previous-bundle "$PREVIOUS_DIR")
          fi
          python -m astro_finance.models.regime_forecast train \
            --data "$RUNNER_TEMP/macro-refresh/macro_regime_history.parquet" \
            --out "$RUNNER_TEMP/model" \
            "${previous[@]}"

      - name: Build and run the quality gates
        id: build
        shell: bash
        env:
          INPUT_TODAY: ${{ github.event.inputs.today }}
          PREVIOUS_DIR: ${{ steps.previous.outputs.previous_dir }}
          MACRO_UNCHANGED_REASON: ${{ github.event.inputs.macro_unchanged_reason }}
        run: |
          set +e
          args=(build --out "$RUNNER_TEMP/events-out")
          args+=(--macro-parquet "$RUNNER_TEMP/macro-refresh/macro_regime_history.parquet")
          args+=(--model-dir "$RUNNER_TEMP/model")
          if [ -n "${INPUT_TODAY:-}" ]; then
            args+=(--today "$INPUT_TODAY")
          fi
          if [ -n "${MACRO_UNCHANGED_REASON:-}" ]; then
            args+=(--macro-allow-unchanged-reason "$MACRO_UNCHANGED_REASON")
          fi
          if [ -n "${PREVIOUS_DIR:-}" ]; then
            args+=(--previous "$PREVIOUS_DIR")
          fi
          python -m astro_finance.events "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload the bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: events-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/events-out/bundle
          retention-days: 90
          if-no-files-found: warn

      - name: Write the quality report to the job summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/events-out/bundle/quality_report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No quality report: the build did not reach the bundle stage." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Append the model promotion decision to the job summary
        if: always()
        shell: bash
        run: |
          promotion="$RUNNER_TEMP/model/models/promotion.json"
          if [ -f "$promotion" ]; then
            {
              echo ""
              echo "## Model promotion"
              echo '```json'
              cat "$promotion"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when the bundle is not publishable
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::Events build exited ${{ steps.build.outputs.exit_code }}; the bundle is not publishable."
          exit 1

  publish:
    name: Publish events bundle release
    needs: build
    if: needs.build.outputs.publishable == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle_dir: ${{ steps.version.outputs.bundle_dir }}
    steps:
      - name: Download the gated bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: events-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/events-bundle

      - name: Read and validate the manifest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find "$RUNNER_TEMP/events-bundle" -name manifest.json -print -quit)"
          test -n "$manifest"
          version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["bundle_version"])' "$manifest")"
          publishable="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1])).get("publishable")).lower())' "$manifest")"
          if [ -z "$version" ] || [ "$publishable" != "true" ]; then
            echo "::error::Bundle manifest is missing a version or is not publishable."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$(dirname "$manifest")" >> "$GITHUB_OUTPUT"

      - name: Create the release idempotently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_DIR: ${{ steps.version.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          tag="events-bundle-$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi
          tarball="$RUNNER_TEMP/events-bundle-$VERSION.tar.gz"
          tar -czf "$tarball" -C "$BUNDLE_DIR" .
          cp "$BUNDLE_DIR/manifest.json" "$RUNNER_TEMP/manifest.json"
          cd "$RUNNER_TEMP"
          sha256sum "events-bundle-$VERSION.tar.gz" manifest.json > SHA256SUMS
          gh release create "$tag" \
            "events-bundle-$VERSION.tar.gz" \
            manifest.json \
            SHA256SUMS \
            --title "Events bundle $VERSION" \
            --notes "Weekly events bundle $VERSION. Manifest publishable=true."

  activate:
    name: Activate events bundle
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: lightsail-production
      cancel-in-progress: false
    steps:
      - name: Activate in the running backend container and verify health
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EVENTS_VERSION: ${{ needs.publish.outputs.version }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          envs: EVENTS_VERSION
          script: |
            set -euo pipefail
            VERSION="${EVENTS_VERSION}"
            APP_DIR="${{ secrets.LIGHTSAIL_APP_DIR }}"
            cd "$APP_DIR" 2>/dev/null || cd "$HOME/$APP_DIR"

            rollback_and_fail() {
              echo "::error::Events activation or health check failed; rolling back."
              docker compose -p strikehike-chrono exec -T backend \
                python -m astro_finance.events rollback || true
              exit 1
            }

            if ! docker compose -p strikehike-chrono exec -T backend \
              python -m astro_finance.events activate --version "$VERSION"; then
              echo "::error::Activation failed; the CLI restored the previous pointer."
              exit 1
            fi

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-connrefused \
              https://strikehike.com/api/v1/events/health \
              | docker compose -p strikehike-chrono exec -T backend \
                  python -c 'import json,sys; payload=json.load(sys.stdin); counts=payload.get("counts") or {}; assert payload.get("active_version") == sys.argv[1]; assert int(counts.get("total", 0)) > 0' "$VERSION"; then
              rollback_and_fail
            fi
            echo "Activated events bundle $VERSION."
