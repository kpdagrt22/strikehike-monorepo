name: Events weekly build

on:
  schedule:
    # Monday 03:00 IST = Sunday 21:30 UTC.
    - cron: "30 21 * * 0"
  workflow_dispatch:
    inputs:
      today:
        description: "Override today (YYYY-MM-DD); leave blank for the UTC date"
        required: false
        type: string
      dry_run:
        description: "Build and gate only; never publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: events-weekly
  cancel-in-progress: false

env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  PYTHONPATH: "src:."

jobs:
  build:
    name: Build and gate the weekly events bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Run the events tests
        run: |
          python -m pytest tests/events -q

      - name: Fetch the newest previous bundle release
        id: previous
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_dir=""
          mkdir -p "$RUNNER_TEMP/previous"
          tag="$(gh release list --limit 100 --json tagName \
            --jq '.[] | select(.tagName | startswith("events-bundle-")) | .tagName' \
            2>/dev/null | head -n 1 || true)"
          if [ -n "$tag" ]; then
            if gh release download "$tag" \
              --pattern 'events-bundle-*.tar.gz' \
              --dir "$RUNNER_TEMP/previous" --clobber; then
              tarball="$(find "$RUNNER_TEMP/previous" -maxdepth 1 \
                -name 'events-bundle-*.tar.gz' | head -n 1)"
              if [ -n "$tarball" ]; then
                mkdir -p "$RUNNER_TEMP/previous/extracted"
                tar -xzf "$tarball" -C "$RUNNER_TEMP/previous/extracted"
                manifest="$(find "$RUNNER_TEMP/previous/extracted" \
                  -name manifest.json -print -quit)"
                if [ -n "$manifest" ]; then
                  previous_dir="$(dirname "$manifest")"
                fi
              fi
            else
              echo "::warning::Could not download $tag; building without a previous bundle."
            fi
          else
            echo "No events-bundle-* release yet; this is the first build."
          fi
          echo "previous_dir=$previous_dir" >> "$GITHUB_OUTPUT"

      - name: Build and run the quality gates
        id: build
        shell: bash
        env:
          INPUT_TODAY: ${{ github.event.inputs.today }}
          PREVIOUS_DIR: ${{ steps.previous.outputs.previous_dir }}
        run: |
          set +e
          args=(build --out "$RUNNER_TEMP/events-out")
          if [ -n "${INPUT_TODAY:-}" ]; then
            args+=(--today "$INPUT_TODAY")
          fi
          if [ -n "${PREVIOUS_DIR:-}" ]; then
            args+=(--previous "$PREVIOUS_DIR")
          fi
          python -m astro_finance.events "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload the bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: events-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/events-out/bundle
          retention-days: 90
          if-no-files-found: warn

      - name: Write the quality report to the job summary
        if: always()
        shell: bash
        run: |
          report="$RUNNER_TEMP/events-out/bundle/quality_report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No quality report: the build did not reach the bundle stage." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when the bundle is not publishable
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::Events build exited ${{ steps.build.outputs.exit_code }}; the bundle is not publishable."
          exit 1

  # architect: release + activation
  publish:
    name: Publish (placeholder)
    needs: build
    if: false
    runs-on: ubuntu-24.04
    steps:
      - name: Not implemented in the build-only phase
        run: |
          echo "architect: release + activation"
