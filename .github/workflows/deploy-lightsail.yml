name: Deploy to Lightsail

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Run backend tests
        run: |
          python -m pytest \
            tests/test_energy_metric_compiler.py \
            tests/test_historical_parallels.py \
            -q

  test-frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy monorepo to Lightsail
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Build new stack, stop legacy edge, cut over
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.LIGHTSAIL_APP_DIR }}"
            cd "$APP_DIR" 2>/dev/null || cd "$HOME/$APP_DIR"
            echo "Deploying from $(pwd)"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            # Build the new stack while the existing site is still serving.
            docker compose -p strikehike-chrono build

            OLD_IDS="$(docker ps -aq --filter 'label=com.docker.compose.project=strikehike' || true)"
            OLD_CONFIG=""
            if [ -n "$OLD_IDS" ]; then
              OLD_FIRST="$(printf '%s\n' "$OLD_IDS" | head -n 1)"
              OLD_CONFIG="$(docker inspect "$OLD_FIRST" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' 2>/dev/null || true)"
            fi

            rollback() {
              echo "::error::New strikehike-chrono stack failed; rolling back to legacy strikehike stack."
              docker compose -p strikehike-chrono down --remove-orphans || true
              if [ -n "$OLD_CONFIG" ] && [ -f "$OLD_CONFIG" ]; then
                docker compose -f "$OLD_CONFIG" -p strikehike up -d --remove-orphans || true
              elif [ -n "$OLD_IDS" ]; then
                docker start $OLD_IDS || true
              fi
              exit 1
            }

            # Free ports 80/443 only after the new images are built.
            if [ -n "$OLD_IDS" ]; then
              if [ -n "$OLD_CONFIG" ] && [ -f "$OLD_CONFIG" ]; then
                if ! docker compose -f "$OLD_CONFIG" -p strikehike down --remove-orphans; then
                  docker update --restart=no $OLD_IDS || true
                  docker stop $OLD_IDS || true
                fi
              else
                docker update --restart=no $OLD_IDS || true
                docker stop $OLD_IDS || true
              fi
            fi

            if ! docker compose -p strikehike-chrono up -d --remove-orphans; then
              rollback
            fi

            docker compose -p strikehike-chrono ps

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-connrefused \
              http://127.0.0.1:8010/health; then
              rollback
            fi

            if ! curl --fail --silent --show-error \
              --retry 36 --retry-delay 5 --retry-connrefused --retry-all-errors \
              --resolve strikehike.com:443:127.0.0.1 \
              https://strikehike.com/ > /dev/null; then
              echo "--- caddy logs ---"
              docker compose -p strikehike-chrono logs --tail=120 caddy || true
              rollback
            fi

            if ! curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-connrefused --retry-all-errors \
              --resolve strikehike.com:443:127.0.0.1 \
              "https://strikehike.com/api/chrono/positions?date=2008-09-15" \
              > /dev/null; then
              echo "--- caddy logs ---"
              docker compose -p strikehike-chrono logs --tail=120 caddy || true
              rollback
            fi

            # The old containers can be removed after the new stack is healthy.
            if [ -n "$OLD_IDS" ]; then
              docker rm $OLD_IDS 2>/dev/null || true
            fi
