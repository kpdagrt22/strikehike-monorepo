name: Deploy to Lightsail

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Run backend tests
        run: |
          python -m pytest \
            tests/test_energy_metric_compiler.py \
            tests/test_historical_parallels.py \
            -q

  test-frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy monorepo to Lightsail
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Pull and rebuild on Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            cd "${{ secrets.LIGHTSAIL_APP_DIR }}"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose up -d --build --remove-orphans
            docker compose ps

            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-connrefused \
              http://127.0.0.1:8010/health

            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-connrefused \
              "http://127.0.0.1/api/chrono/positions?date=2008-09-15" \
              > /dev/null
