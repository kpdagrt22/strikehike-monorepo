name: Deploy to Lightsail

on:
  push:
    branches: [main]
  # Pull requests run the test jobs only; the deploy job never runs for them.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse_rollback:
        description: "Deploy this commit, force the probes to fail, restore the previous images (green if the restore passes every probe)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # PR runs get their own group so they never queue behind (or cancel) a deploy.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'lightsail-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: "src:."
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Run backend tests
        run: |
          python -m pytest \
            tests/events \
            tests/test_energy_metric_compiler.py \
            tests/test_historical_parallels.py \
            tests/test_macro_ingestion.py \
            tests/test_patterns.py \
            tests/test_regime_service.py \
            tests/test_regime_cases.py \
            tests/test_analytics_schema.py \
            tests/test_analytics_store.py \
            tests/test_analytics_api.py \
            tests/test_analytics_activation.py \
            -q

  test-frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Copy guard
        run: npm run check:copy

      - name: Route cache tests
        run: npm run test:route-cache

      - name: Unit tests
        run: npm run test:unit

      - name: Tracker size
        run: npm run check:tracker

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"

  test-frontend-smoke:
    name: Frontend smoke
    runs-on: ubuntu-24.04
    # The suite now covers the home, upcoming, event and gauge pages (142
    # tests, including the gauge's review screenshots and videos).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Prepare a smoke events bundle
        working-directory: backend
        run: |
          PYTHONPATH="src:." python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          from astro_finance.events.pipeline import PipelineOptions, run_pipeline
          from astro_finance.events.store import upcoming_totals_by_theme

          now = datetime.now(timezone.utc)
          result = run_pipeline(
              PipelineOptions(
                  out_dir=Path("/tmp/smoke-events-build"),
                  offline_dir=Path("tests/events/fixtures/offline"),
                  now=now,
                  created_at=now,
                  execution_id="smoke-bundle",
              )
          )
          runtime = Path("/tmp/smoke-events")
          runtime.mkdir(parents=True, exist_ok=True)
          (runtime / "current").write_text(
              str(result.bundle_dir) + "\n", encoding="utf-8"
          )
          print(f"smoke bundle: {result.bundle_dir} ({result.bundle_version})")
          counts = upcoming_totals_by_theme(
              result.bundle_dir / "events.sqlite", None, today=now.date()
          )
          print(
              "upcoming by theme: "
              + ", ".join(f"{theme}={count}" for theme, count in counts.items())
          )
          if counts.get("Finance", 0) < 5 or counts.get("Science", 0) < 2:
              print(
                  "::warning::Smoke fixture is running out of future dates: "
                  "refresh backend/tests/events/fixtures/offline"
              )
          PY

      - name: Start the smoke backend
        working-directory: backend
        run: |
          set -euo pipefail
          PYTHONPATH="src:." LOAD_ML_MODELS=0 \
            ANALYTICS_INGEST_ENABLED=1 ANALYTICS_DB=/tmp/smoke-analytics.sqlite \
            EVENTS_RUNTIME_DIR=/tmp/smoke-events \
            nohup uvicorn api_server:app --host 127.0.0.1 --port 8010 \
            > /tmp/backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/backend.log
              exit 1
            fi
            sleep 2
          done

      - name: Build frontend
        run: npm run build
        env:
          CHRONO_API_URL: "http://127.0.0.1:8010"
          NEXT_TELEMETRY_DISABLED: "1"
          TURBO_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_ANALYTICS_ENABLED: "1"
          NEXT_PUBLIC_BUILD_SHA: "smoke01"

      - name: Start the frontend and run the smoke tests
        run: |
          set -euo pipefail
          CHRONO_API_URL=http://127.0.0.1:8010 PORT=3000 HOSTNAME=127.0.0.1 \
            nohup npm run start > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/frontend.log
              exit 1
            fi
            sleep 2
          done
          npx playwright test
          # The normal-browser test must have reached the backend's store.
          sleep 2
          python -c 'import sqlite3; n = sqlite3.connect("/tmp/smoke-analytics.sqlite").execute("SELECT COUNT(*) FROM events").fetchone()[0]; print("stored events:", n); assert n > 0, "no event reached the store"'

      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-screens-${{ github.run_id }}
          path: frontend/smoke-screens
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: frontend/test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy monorepo to Lightsail
    needs: [test-backend, test-frontend, test-frontend-smoke]
    # Production only: pushes to main, or a manual run started from main.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Build new stack, stop legacy edge, cut over
        uses: appleboy/ssh-action@v1.2.0
        env:
          REHEARSE_ROLLBACK: ${{ github.event.inputs.rehearse_rollback || 'false' }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          # No script_stop: it appends an exit-code check after every line,
          # which exits at the top of any function called just after a false
          # test (and in every else branch). The script's own
          # `set -euo pipefail` handles failures correctly.
          command_timeout: 30m
          envs: REHEARSE_ROLLBACK
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.LIGHTSAIL_APP_DIR }}"
            cd "$APP_DIR" 2>/dev/null || cd "$HOME/$APP_DIR"
            echo "Deploying from $(pwd)"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            MARKER="NBER recession windows from FRED"
            BASE_URL="https://strikehike.com"
            CURL=(curl --fail --silent --show-error --resolve strikehike.com:443:127.0.0.1)

            tag_rollback_images() {
              for service in backend frontend; do
                cid="$(docker compose -p strikehike-chrono ps -q "$service" 2>/dev/null || true)"
                if [ -n "$cid" ]; then
                  image_id="$(docker inspect --format '{{.Image}}' "$cid" 2>/dev/null || true)"
                  if [ -n "$image_id" ] && docker tag "$image_id" "strikehike-rollback-${service}:rollback"; then
                    echo "Tagged ${service} image ${image_id} as :rollback."
                  else
                    echo "::warning::Could not tag the ${service} rollback image."
                  fi
                fi
              done
            }

            # Tag the running images before the new build can replace their
            # names. The running containers keep the old image IDs.
            tag_rollback_images

            # A rehearsal must never reach the cutover without images to go
            # back to; stop here, before anything has changed.
            if [ "${REHEARSE_ROLLBACK:-false}" = "true" ]; then
              for service in backend frontend; do
                if ! docker image inspect "strikehike-rollback-${service}:rollback" > /dev/null 2>&1; then
                  echo "::error::Cannot rehearse: no :rollback image for ${service}. Nothing was changed."
                  exit 1
                fi
              done
            fi

            # Build the new stack while the existing site is still serving.
            export BUILD_SHA="$(git rev-parse --short=7 HEAD)"
            docker compose -p strikehike-chrono build

            OLD_IDS="$(docker ps -aq --filter 'label=com.docker.compose.project=strikehike' || true)"
            OLD_CONFIG=""
            if [ -n "$OLD_IDS" ]; then
              OLD_FIRST="$(printf '%s\n' "$OLD_IDS" | head -n 1)"
              OLD_CONFIG="$(docker inspect "$OLD_FIRST" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' 2>/dev/null || true)"
            fi

            legacy_rollback() {
              echo "::error::New strikehike-chrono stack failed; rolling back to legacy strikehike stack."
              docker compose -p strikehike-chrono down --remove-orphans || true
              if [ -n "$OLD_CONFIG" ] && [ -f "$OLD_CONFIG" ]; then
                docker compose -f "$OLD_CONFIG" -p strikehike up -d --remove-orphans || true
              elif [ -n "$OLD_IDS" ]; then
                docker start $OLD_IDS || true
              fi
              exit 1
            }

            rollback_images() {
              for service in backend frontend; do
                if ! docker image inspect "strikehike-rollback-${service}:rollback" > /dev/null 2>&1; then
                  return 1
                fi
              done
              override="$(mktemp)"
              {
                echo "services:"
                for service in backend frontend; do
                  echo "  ${service}:"
                  echo "    image: strikehike-rollback-${service}:rollback"
                done
              } > "$override"
              if ! docker compose -p strikehike-chrono -f docker-compose.yml -f "$override" \
                up -d --remove-orphans; then
                rm -f "$override"
                return 1
              fi
              rm -f "$override"
              return 0
            }

            prune_after_success() {
              protected="$(
                {
                  docker compose -p strikehike-chrono ps -q \
                    | xargs -r docker inspect --format '{{.Image}}' || true
                  docker image ls --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
                    | awk '$2 ~ /:rollback$/ {print $1}'
                } | sort -u
              )"
              # Full sha256 IDs on both sides, so the protected list matches.
              for id in $(docker image ls --no-trunc --format '{{.ID}}' --filter "until=24h" | sort -u); do
                if printf '%s\n' "$protected" | grep -qx "$id"; then
                  continue
                fi
                docker image rm "$id" > /dev/null 2>&1 || true
              done
              docker image prune -f > /dev/null 2>&1 || true
              docker builder prune -f --filter "until=24h" > /dev/null 2>&1 || true
              docker container prune -f --filter "until=24h" > /dev/null 2>&1 || true
            }

            probe_backend() {
              curl --fail --silent --show-error \
                --retry 12 --retry-delay 5 --retry-connrefused \
                http://127.0.0.1:8010/health > /dev/null
            }

            probe_events() {
              "${CURL[@]}" "$BASE_URL/api/v1/events/health" \
                | docker compose -p strikehike-chrono exec -T backend \
                    python -c 'import json,sys; payload=json.load(sys.stdin); counts=payload.get("counts") or {}; assert int(counts.get("total", 0)) > 0'
            }

            probe_atlas() {
              # The first atlas request after a deploy is cold (the backend has
              # to read and serialise the whole weekly history), and the Next
              # proxy gives up at 15 s. Retry before calling the release bad.
              for attempt in $(seq 1 12); do
                if "${CURL[@]}" "$BASE_URL/api/v1/regime/macro-history?resolution=weekly&view=atlas" \
                  | docker compose -p strikehike-chrono exec -T backend \
                      python -c 'import json,sys; payload=json.load(sys.stdin); assert len(payload.get("timeline") or []) > 8000'; then
                  return 0
                fi
                if [ "$attempt" -eq 12 ]; then
                  return 1
                fi
                sleep 5
              done
              return 1
            }

            probe_upcoming() {
              "${CURL[@]}" "$BASE_URL/api/v1/events/upcoming" > /dev/null
            }

            probe_home() {
              "${CURL[@]}" "$BASE_URL/" > /dev/null
            }

            probe_regime() {
              page="$(mktemp)"
              for attempt in $(seq 1 30); do
                if "${CURL[@]}" "$BASE_URL/regime" -o "$page" \
                  && grep -qF "$MARKER" "$page"; then
                  rm -f "$page"
                  return 0
                fi
                if [ "$attempt" -eq 30 ]; then
                  rm -f "$page"
                  return 1
                fi
                sleep 3
              done
              rm -f "$page"
              return 1
            }

            probe_upcoming_page() {
              page="$(mktemp)"
              for attempt in $(seq 1 30); do
                if "${CURL[@]}" "$BASE_URL/upcoming" -o "$page" \
                  && grep -Eq 'data-upcoming-count="[1-9]' "$page"; then
                  rm -f "$page"
                  return 0
                fi
                if [ "$attempt" -eq 30 ]; then
                  rm -f "$page"
                  return 1
                fi
                sleep 3
              done
              return 1
            }

            probe_chrono() {
              "${CURL[@]}" "$BASE_URL/api/chrono/positions?date=2008-09-15" > /dev/null
            }

            # Containers take a while to start and Caddy may still be
            # provisioning TLS, so wait (up to ~4 min) before the strict probes.
            wait_ready() {
              probe_backend \
                && "${CURL[@]}" --retry 36 --retry-delay 5 --retry-connrefused --retry-all-errors \
                  "$BASE_URL/" > /dev/null
            }

            warm_up() {
              probe_atlas \
                && probe_upcoming \
                && probe_home \
                && probe_regime \
                && probe_upcoming_page
            }

            run_probes() {
              probe_backend \
                && probe_events \
                && probe_chrono \
                && probe_atlas \
                && probe_home \
                && probe_regime \
                && probe_upcoming_page
            }

            show_caddy_logs() {
              echo "--- caddy logs ---"
              docker compose -p strikehike-chrono logs --tail=120 caddy || true
            }

            # Free ports 80/443 only after the new images are built.
            if [ -n "$OLD_IDS" ]; then
              if [ -n "$OLD_CONFIG" ] && [ -f "$OLD_CONFIG" ]; then
                if ! docker compose -f "$OLD_CONFIG" -p strikehike down --remove-orphans; then
                  docker update --restart=no $OLD_IDS || true
                  docker stop $OLD_IDS || true
                fi
              else
                docker update --restart=no $OLD_IDS || true
                docker stop $OLD_IDS || true
              fi
            fi

            if ! docker compose -p strikehike-chrono up -d --remove-orphans; then
              if ! rollback_images && [ -n "$OLD_IDS" ]; then
                legacy_rollback
              fi
              exit 1
            fi

            # Give Caddy a baseline window to provision the certificate before probing TLS.
            sleep 15

            docker compose -p strikehike-chrono ps

            if [ "${REHEARSE_ROLLBACK:-false}" = "true" ]; then
              echo "::warning::Rollback rehearsal requested; the probe gate is forced to fail so the :rollback images are restored; the job passes if the restore works."
              PROBES_OK=1
            elif wait_ready && warm_up && run_probes; then
              PROBES_OK=0
            else
              PROBES_OK=1
              show_caddy_logs
            fi

            if [ "$PROBES_OK" -ne 0 ]; then
              if [ "${REHEARSE_ROLLBACK:-false}" = "true" ]; then
                echo "Rehearsal: restoring the :rollback images."
              else
                echo "::error::The new release failed its probes; restoring the :rollback images."
              fi
              if rollback_images; then
                if wait_ready && warm_up && run_probes; then
                  # A rehearsal passes (green) when the restore works; only a
                  # real failed release keeps the job red.
                  if [ "${REHEARSE_ROLLBACK:-false}" = "true" ]; then
                    echo "::notice::Rollback rehearsal passed: the previous images were restored and passed every probe."
                    exit 0
                  fi
                  echo "::error::Previous images restored and passed the probes; failing this job because the new release did not."
                else
                  echo "::error::Previous images were restored but the probes still fail."
                  show_caddy_logs
                fi
              elif [ -n "$OLD_IDS" ]; then
                echo "::error::No :rollback images are available."
                legacy_rollback
              else
                # Nothing older to start: taking the stack down would only
                # turn a degraded site into an offline one.
                echo "::error::No :rollback images and no legacy stack; leaving the new release running."
              fi
              exit 1
            fi

            # The old containers can be removed after the new stack is healthy.
            if [ -n "$OLD_IDS" ]; then
              docker rm $OLD_IDS 2> /dev/null || true
            fi

            prune_after_success
            df -h /
            docker compose -p strikehike-chrono exec -T backend \
              du -sh /app/data/runtime/analytics 2>/dev/null || true
