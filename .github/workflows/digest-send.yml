name: Send weekly digest

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week to send, for example 2026-W47"
        required: true
        type: string
      dry_run:
        description: "Render and count only (no email is sent)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  send:
    name: Render or send one approved week
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Run the digest command on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIGEST_WEEK: ${{ inputs.week }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TOKEN_SECRET: ${{ secrets.DIGEST_TOKEN_SECRET }}
          DIGEST_ENABLED: ${{ vars.DIGEST_ENABLED }}
          DIGEST_POSTAL_ADDRESS: ${{ vars.DIGEST_POSTAL_ADDRESS }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          # No script_stop: the script's own set -euo pipefail handles failures.
          command_timeout: 30m
          envs: DIGEST_WEEK,DIGEST_DRY_RUN,RESEND_API_KEY,DIGEST_TOKEN_SECRET,DIGEST_ENABLED,DIGEST_POSTAL_ADDRESS
          script: |
            set -euo pipefail

            if ! printf '%s' "$DIGEST_WEEK" | grep -Eq '^[0-9]{4}-W[0-9]{2}$'; then
              echo "::error::week must look like 2026-W47"
              exit 1
            fi

            APP_DIR="${{ secrets.LIGHTSAIL_APP_DIR }}"
            cd "$APP_DIR" 2>/dev/null || cd "$HOME/$APP_DIR"
            echo "Digest week $DIGEST_WEEK, dry_run=$DIGEST_DRY_RUN"

            FLAG="--dry-run"
            if [ "$DIGEST_DRY_RUN" = "false" ]; then
              FLAG="--send"
            fi

            # Names only: docker takes the values from the environment, so the
            # secrets never appear in the server's process list.
            docker compose -p strikehike-chrono exec -T \
              -e RESEND_API_KEY \
              -e DIGEST_TOKEN_SECRET \
              -e DIGEST_ENABLED \
              -e DIGEST_POSTAL_ADDRESS \
              backend python -m astro_finance.digest send \
                --week "$DIGEST_WEEK" \
                "$FLAG" \
                --sample-dir /app/data/runtime/digest-samples
