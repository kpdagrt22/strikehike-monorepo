name: Regime macro ingestion

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch FRED macro universe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-minimal.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-minimal.txt

      - name: Require FRED_API_KEY
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::Add the FRED_API_KEY repository secret: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Build macro regime artifact
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m scripts.flows.macro_ingestion \
            --source api \
            --output-dir data/processed

      - name: Upload macro regime artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-regime-history
          if-no-files-found: error
          path: |
            backend/data/processed/macro_regime_history.parquet
            backend/data/processed/macro_regime_history.meta.json
            backend/data/processed/crypto_milestones.json
            backend/data/processed/patterns_v2_skill.json
