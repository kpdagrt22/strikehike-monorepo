version: '3.8'

services:
  app:
    build: .
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - LOG_LEVEL=DEBUG
    command: python -m astro_finance.main run-pipeline

  scheduler:
    build: .
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
    command: python -m astro_finance.main schedule

  tests:
    build: .
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./data:/app/data
    command: pytest tests/
