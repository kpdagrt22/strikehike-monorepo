# Prefect Project Configuration
name: astro-finance-production
prefect-version: 3.6.10

# Pull steps - how to retrieve the code
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: d:\astro_finance_clean

# Build steps (optional)
build: null

# Push steps (optional)
push: null

# Deployments defined in this project
deployments:
  - name: daily-data-ingest
    entrypoint: scripts/flows/data_ingestion.py:incremental_data_ingestion
    work_pool:
      name: default
    schedule:
      cron: "5 0 * * *"
      timezone: "UTC"
    parameters:
      symbol: "SPY"
    tags:
      - production
      - data-pipeline

  - name: daily-inference
    entrypoint: scripts/flows/model_inference.py:daily_model_inference
    work_pool:
      name: default
    schedule:
      cron: "30 0 * * *"
      timezone: "UTC"
    tags:
      - production
      - ml-pipeline

  - name: tradingview-export
    entrypoint: scripts/flows/tradingview_generator.py:tradingview_script_generator
    work_pool:
      name: default
    schedule:
      cron: "0 1 * * *"
      timezone: "UTC"
    parameters:
      confidence_threshold: 0.8
      max_signals: 20
    tags:
      - production
      - tradingview
