#
# Every date below was read on the official page in source_url on the
# verified_on date.  The pages publish dates but not decision times, so these
# entries are all-day.  Add new entries only after opening the official page.
#
# Schema:
#   [[events]]
#   theme = "Finance"
#   name = "..."
#   date = "YYYY-MM-DD"
#   external_id = "..."             # optional, stable per occurrence
#   source_url = "https://..."      # official page, required
#   verified_on = "YYYY-MM-DD"      # required
#   status = "scheduled"            # scheduled | tentative | cancelled
#   description = "..."             # optional
#   time = "HH:MM"                  # optional; requires timezone
#   timezone = "Europe/London"      # IANA zone; required when time is set

