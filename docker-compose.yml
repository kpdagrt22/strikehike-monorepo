name: strikehike-chrono

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      LOAD_ML_MODELS: "0"
      ENABLE_LEGACY_WEBSOCKET: "0"
      HISTORICAL_EVENTS_DB: /app/data/runtime/historical_events.db
      HISTORICAL_EVENTS_SEED: /app/data/historical_events.json
      ANALYTICS_DB: /app/data/runtime/analytics/analytics.sqlite
      ANALYTICS_INGEST_ENABLED: "1"
      GROWTH_EXPORT_TOKEN: "${GROWTH_EXPORT_TOKEN:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      DIGEST_TOKEN_SECRET: "${DIGEST_TOKEN_SECRET:-}"
      DIGEST_ENABLED: "${DIGEST_ENABLED:-}"
      DIGEST_POSTAL_ADDRESS: "${DIGEST_POSTAL_ADDRESS:-}"
      DIGEST_FROM: "${DIGEST_FROM:-StrikeHike <digest@strikehike.com>}"
      DIGEST_REPLY_TO: "${DIGEST_REPLY_TO:-}"
      DIGEST_BASE_URL: "${DIGEST_BASE_URL:-https://strikehike.com}"
      DIGEST_CONTENT_URL: "${DIGEST_CONTENT_URL:-http://frontend:3000}"
      DIGEST_DB: /app/data/runtime/analytics/digest.sqlite
      PYTHONUNBUFFERED: "1"
    ports:
      # Host-loopback only. The frontend reaches it over the internal network.
      - "127.0.0.1:8010:8010"
    volumes:
      - historical-data:/app/data/runtime
      - caddy-logs:/app/data/caddy-logs:ro
    networks:
      - strikehike
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_ANALYTICS_ENABLED: "1"
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-dev}
    environment:
      CHRONO_API_URL: http://backend:8010
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - strikehike
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - strikehike
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  strikehike:
    driver: bridge

volumes:
  historical-data:
  caddy-data:
  caddy-config:
  caddy-logs:
