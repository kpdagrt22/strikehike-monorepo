name: strikehike

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      LOAD_ML_MODELS: "0"
      ENABLE_LEGACY_WEBSOCKET: "0"
      HISTORICAL_EVENTS_DB: /app/data/runtime/historical_events.db
      HISTORICAL_EVENTS_SEED: /app/data/historical_events.json
      PYTHONUNBUFFERED: "1"
    ports:
      # Host-loopback only. The frontend reaches it over the internal network.
      - "127.0.0.1:8010:8010"
    volumes:
      - historical-data:/app/data/runtime
    networks:
      - strikehike
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CHRONO_API_URL: http://backend:8010
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - strikehike
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  strikehike:
    driver: bridge

volumes:
  historical-data:
